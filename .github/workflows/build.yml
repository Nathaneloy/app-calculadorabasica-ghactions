name: Android Tests

# Trigger SonarCloud analysis on pushes to the long-lived branches.
on:
  push:
    branches:
      - main
      - develop

jobs:

  # Run unit and ui tests together, to capture the test coverage of both
  android-tests:
    name: Android Tests
    # ubuntu-latest will migrate to Ubuntu 26 on 2026-10-19; pin 24.04 to avoid the change
    runs-on: ubuntu-24.04

    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          # full history so SonarCloud SCM/new-code detection works
          fetch-depth: 0

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 21

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        working-directory: .
        run: chmod +x ./gradlew

      - name: Run Android tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          api-level: 29
          working-directory: .
          profile: pixel_2
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu off -no-snapshot -noaudio -no-boot-anim
          script: ./gradlew clean jacocoTestReport sonar

      - name: Android tests reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: ./app/build/reports/

      - name: Android tests outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-outputs
          path: ./app/build/outputs/